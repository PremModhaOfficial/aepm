# Review policy for the self-hosted pr-agent run in .github/workflows/pr-agent.yml.
# Only overrides belong here; every other default comes from
# pr_agent/settings/configuration.toml at the pinned pr-agent version.
# The decision record with sources is .github/PR-AGENT.md.

[config]
# Command Code Provider API, OpenAI-compatible:
# https://api.commandcode.ai/provider/v1
model = "openai/deepseek/deepseek-v4.1-flash"
# A fallback that names the same model doubles the worst case without changing
# who answers: run 44910602395 spent 900.27s and 900.1s on that one model and
# ended `Failed to generate prediction with any model of [x, x]`. Empty means one
# attempt, so one hung request fails in ~25 minutes (`ai_timeout = 1500`) instead
# of ~50. A run makes two requests on open (`/describe` and `/review`), so the
# worst case is ~50 minutes against the 65-minute job, which keeps 900s to post
# the failure.
fallback_models = []

# Live model list reports context_length = 1000000. pr-agent refuses an unknown
# model id unless the window is declared.
custom_model_max_tokens = 1000000
# Input and output share this budget: max_model_tokens must exceed
# max_output_tokens or the prompt has no input capacity left. 256000 left 128000
# for input, a cap on the diff that the model does not impose: the live list
# reports context_length = 1000000, so the budget is that window.
max_model_tokens = 1000000
# Reasoning is on at max, not high: `medium` is not a value this model accepts — the CLI registry lists reasoningEfforts=[off,low,high,max] (PR-AGENT.md
# D5) and pr-agent forwards the string verbatim, so an unlisted value is swallowed
# by the gateway with no error — measured `200` for "medium", which means it is
# not evidence of anything. What a large diff's failure is: not isolated. Run
# 44910602395 (27,798-token diff) spent 900.27s and 900.1s on the request clock and
# the attempt between them returned `503 ... error 1102 ... Worker exceeded
# resource limits` (`retryable: false`, `owner_action_required: true`). Two of the
# three were killed by the clock, so 1500s is worth its 900s of headroom before any
# other cause is named. large_patch_policy is unset, so the whole 27.8k diff is
# sent every time.
# A 64k cap returned empty content (`finish_reason=length`); 128k finished. off
# measured ~22s; low measured 118-417s; high is unmeasured on a large diff — if a
# review still reports 1102 at max, measure high, then drop to low.
max_output_tokens = 128000
reasoning_effort = "max"
# LiteLLM does not know this id, so pr-agent only forwards reasoning_effort when
# the id is listed here (configuration.toml: additional_reasoning_effort_models).
additional_reasoning_effort_models = ["openai/deepseek/deepseek-v4.1-flash"]
# Default is 120s, far shorter than a measured max-reasoning review (498-509s).
# One attempt now that fallback_models is empty, so the ceiling is per request,
# not per attempt: over 23 recorded calls (review comment run details, PRs #130-#159)
# per-call time was p50 325s, p95 414s, max 848s. 600 clips the single 848s call
# that succeeded; 900 covers every recorded call with 52s to spare but was still
# killed on a 30,105-token diff (run 44920542869: 900.36s and 900.12s, both
# litellm timeouts, no comment posted). 1500 is 1.8x the worst recorded call; it
# is a per-request timeout, and a run makes two requests on open, so 3000s of the
# 3900s job budget is requests and 900s is left to post.
ai_timeout = 1500
retry_same_model_on_timeout = false

# Read the rules from the default branch, never from the PR branch, so a PR
# cannot rewrite the rules it is judged by.
repo_context_files = ["AGENTS.md", "NEXT.md", "context.md", ".github/PR-AGENT.md"]
repo_context_from_default_branch = true
repo_context_max_lines = 900

# Token usage on the review comment (model, tokens in/out/total, duration, AI
# calls). The job log only prints prompt tokens, so this is the only honest
# usage figure. `output_run_cost` stays off: litellm has no price for this model
# id and would print "unavailable" on every review.
output_run_details = true

response_language = "en-US"

[pr_reviewer]
num_max_findings = 5
require_tests_review = true
# Agent-first output (AX): file:line findings plus typed risk and merge-verdict
# fields that a coding agent can act on without parsing prose.
inline_key_issues = true
require_risk_assessment = true
require_merge_recommendation = true
# Minimal schema: drop rows that only help a human triage (effort estimate,
# ticket analysis) and the intro line. Keep the coverage footer: it is the only
# disclosure when the chunk cap leaves files unreviewed.
require_estimate_effort_to_review = false
require_ticket_analysis_review = false
enable_intro_text = false
enable_review_coverage_footer = true
# Large PRs are chunked instead of skipped or truncated. When more chunks are
# needed than max_number_of_calls, the coverage footer lists the remainder.
enable_large_pr_chunking = true
max_number_of_calls = 3
extra_instructions = """
This repo is a Rust CLI that splits Arch Linux updates into a background
download (`fetch`) and a foreground install (`install`). AGENTS.md, NEXT.md, and
context.md are already in your context. Treat them as binding requirements.

Write for an agent consumer first. Each finding gives the file, the line, the
invariant violated, and the exact change required. Do not restate the diff. The
risk level and merge verdict are the decision surface.

Treat these as blocking findings:
- Any code path outside `install` that writes /usr, /etc, or
  /var/lib/pacman/local; any write at all from `check` or `doctor`; `fetch`
  touching anything beyond the pacman sync DB and the download cache.
- `std::process::Command` outside src/runner.rs instead of the CommandRunner
  trait.
- `unwrap()` on external input (file contents, command output, argv). `expect`
  is allowed only for an invariant proven above it.
- sudo around yay, makepkg, or any AUR build. Only `pacman -Syuw` escalates, as
  `sudo -n` with the exact argv in the sudoers rule.
- A wildcard sudoers rule, or deleting /var/lib/pacman/db.lck instead of
  refusing while pacman holds it.
- An exit code outside the contract: 0 healthy/done, 1 gated/action needed,
  2 execution error.
- A side-effect claim (fetch downloads, install changes /usr) proven only by a
  FakeRunner unit test, with no entry in sim/scenarios/.
- A gate turned into a silent skip that still prints success, or a stub
  presented as implemented.
- A pacman-behaviour change with no sim scenario and no NEXT.md checkbox ticked
  in the same commit, or a command/flag/path change with no README update.

Check these when the diff touches them:
- pacman 7.1 downloads as DownloadUser=alpm; a moved CacheDir must be writable
  by that user or downloads fail.
- `Qk` proves presence only. `Qkk` plus mtree catches damage. Do not credit
  `Qk` with detecting a broken install.
- libalpm mis-orders multiple CacheDir entries (pacman#289). Do not recommend a
  second CacheDir.
- Snapper range limits need two values ("10-20"); a single number is ignored.
- cargo-deny runs with --all-features; a feature-gated dependency is invisible
  to the audit otherwise.
- Do not propose new dependencies for parsing that state.rs already handles by
  hand.

Report only findings that block a merge or violate a rule below. Skip naming,
formatting, and comment-only suggestions.

A line inside a comment is not the code. A comment that quotes a pattern,
including one describing a bug that was fixed, is prose: only the statement
beside it is the implementation. Never report a comment's text as the code at
its line, and never quote a removed pattern as current.
"""

[pr_description]
extra_instructions = """
Name the NEXT.md phase item this PR completes and what proves it: a unit test, a
./sim/run.sh scenario, or both. If the PR changes pacman behaviour and names no
sim scenario, say so. Do not claim test coverage the diff does not show.
"""

[pr_code_suggestions]
focus_only_on_problems = true
extra_instructions = """
Only suggest changes that fix a bug, a safety-rule violation, or a correctness
gap. No style rewrites, renames, added comments, or new dependencies.
"""

# #115: a pushed head is reviewed too. The action skips `synchronize` unless
# `handle_push_trigger` is on and `push_commands` names what to run
# (pr_agent/servers/github_action_runner.py @ 0.50.0: without an entry it logs
# "No push_commands configured, skipping synchronize" and returns). `/review`
# only: the description is not re-generated on every push. Its own guards stay on:
# a merge commit and a bot's push are skipped, and the workflow's reviewed-SHA
# step skips a commit that already carries a complete review.
[github_action_config]
handle_push_trigger = true
push_commands = ["/review"]
