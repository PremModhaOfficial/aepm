name: Review Gate

# Model-free coverage gate. It reads the newest review comment and decides
# whether that review covers one commit: the PR head. It never calls a model and
# never spends credits. It also appends one ledger row per judged head, because
# the review is a single comment updated in place and a block erased by such a
# rewrite would otherwise leave no trace (finding 09d3fb2ec6ef).
#
# #115: a pushed head used to have no `Review Gate` check at all, because the
# review bot did not run on push. `PR Agent` now reviews a pushed head too, and
# this gate judges the head that review was about.
#
# Where the verdict lands is not the run's own check. Measured on 2026-11-19: a
# `workflow_run`-triggered workflow runs on the default branch and its check is
# attached to the default branch's HEAD, not to the commit the review run checked
# out (20/20 `Review Gate` runs listed `headBranch: main`, including one whose
# `workflow_run.head_sha` was PR #132's head). So this job's own check can never
# gate a PR head, and it must never fail on a review verdict either: that would
# put a red `Review Gate` on `main` that outlives the PR it described (#111). It
# writes the verdict onto the PR head through the Checks API instead, which is
# also what lets a later `/review` revise it (PR-AGENT.md N13/N14).
#
# The trigger is `workflow_run`, not `pull_request`: a `pull_request` workflow
# executes the PR's own copy of this file and of the script that judges it.
on:
  workflow_run:
    workflows: ["PR Agent"]
    types: [completed]

permissions:
  contents: read
  # Read the review comments, and append the ledger row: a comment on the PR.
  pull-requests: write
  # Reading the triggering run's name and pull_requests.
  actions: read
  # Writing the verdict onto the PR head.
  checks: write

concurrency:
  # Keyed on the run, not the head: the run is what is being judged, and two
  # runs for one PR must not cancel each other's verdict. The later write wins
  # on the head, which is the verdict from the newest review.
  group: review-gate-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review Gate
    # Fork PRs are skipped by the review bot because `pull_request` does not
    # expose secrets to them, so the gate would fail forever with no way to
    # produce a review. This matches the bot's fork policy.
    # A skipped `/review` run changed nothing (the comment was not authorized),
    # so there is no review to judge.
    # A skipped review run on a push is a draft PR; that one is still evaluated,
    # because a draft that becomes ready must not inherit a pass it never earned.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !(github.event.workflow_run.event == 'issue_comment' &&
        github.event.workflow_run.conclusion == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The script comes from the default branch, never from the PR head and
      # never from the PR's base ref: a PR aimed at another branch would
      # otherwise choose the script that judges it.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Review must exist for this head
        id: gate
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # --- review-gate:begin ---
          pr="${RUN_PR:-}"
          # A `/review` run carries no `pull_requests` entry and reports the
          # default branch as its head, so its PR comes from its run name. That
          # name is evaluated in an `issue_comment` run, which always loads the
          # default branch's copy of this workflow.
          if [[ -z "$pr" && "$RUN_EVENT" == "issue_comment" && "$RUN_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            pr="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .display_title 2>/dev/null \
              | grep -o 'PR #[0-9]\+' | tr -dc '0-9' || true)"
          fi
          [[ -n "$pr" ]] || { echo "::error::cannot tell which PR this run reviewed"; exit 1; }
          # One head, resolved once and pinned for every check that reads it.
          head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          # An unreadable head is not "superseded" and is not a pass: failing
          # loudly is the only honest answer to an API fault.
          if [[ -z "$head" ]]; then
            echo "::error::cannot read the head of PR $pr; refusing to report a pass"
            exit 1
          fi
          # A push run reports on the head it reviewed. A `/review` run checked
          # out the default branch but reviewed the PR, so it reports on the head
          # too. A push run whose head moved on before it finished reviewed a
          # commit that has its own run, so it reports nothing. Writing a verdict
          # about the newer head from a review of the older one would redden a
          # head nobody judged, and writing a `neutral` check on the older commit
          # would be worse than nothing: a neutral conclusion counts as a success
          # for a required check, so a commit nobody cleared would carry a pass.
          # Reporting nothing leaves the older commit's last check on the older
          # commit, which no rollup reads, because checks are per-commit.
          if [[ "$RUN_SHA" == "$head" || "$RUN_EVENT" == "issue_comment" ]]; then
            report=true
          else
            report=false
          fi
          if [[ "$report" != "true" ]]; then
            echo "::notice::PR $pr is at $head; this run reviewed ${RUN_SHA:0:7}, which has its own review run, so it reports nothing"
            echo "report=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! scripts/review-state.sh --help | grep -q -- '--gate'; then
            # Before the gate exists on the default branch this workflow cannot
            # run at all, so this means the default branch lost `--gate`. A
            # neutral result would be counted as a pass, so this fails.
            echo "::error::$DEFAULT_BRANCH has no review-state.sh --gate; refusing to report a pass"
            exit 1
          fi
          # Fail closed, on the pinned head: no review, a review of another
          # commit, an incomplete run, and a verdict that did not clear the merge
          # all land on the head as a `failure`. This job itself stays green,
          # because its own check is anchored on the default branch.
          set +e
          verdict="$(scripts/review-state.sh "$pr" --gate --sha "$head" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$verdict"
          conclusion=failure
          if [[ "$rc" -eq 0 ]]; then conclusion=success; fi
          summary="$(sed -n 's/^reason: //p' <<<"$verdict" | head -1)"
          [[ -n "$summary" ]] || summary="the review gate reported $conclusion"
          echo "report=$conclusion" >> "$GITHUB_OUTPUT"
          # The review is one comment a run rewrites in place, so a run that wrote
          # it without the block erased the only evidence one had existed, and
          # the gate would judge the review clean (finding 09d3fb2ec6ef). This row
          # is that evidence: one separate comment per judged head, appended and
          # never edited, carrying the fields the gate printed. It is posted before
          # the verdict below, and a row that cannot be written is a warning, not
          # a failed PR: a ledger is an aid to judging, never the verdict itself.
          ledger="$(sed -n 's/^ledger: //p' <<<"$verdict" | head -1)"
          if [[ -z "$ledger" ]]; then
            echo "::warning::the gate printed no ledger line, so no row was appended for $head"
          elif ! gh api -X POST "repos/$GH_REPO/issues/$pr/comments" \
            -f body="<!-- review-gate-ledger:v1 $ledger -->" >/dev/null; then
            echo "::warning::could not append the ledger row for $head; the verdict below stands"
          else
            echo "::notice::ledger row appended for $head: $ledger"
          fi
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          jq -n --arg name 'Review Gate' --arg sha "$head" --arg conclusion "$conclusion" \
            --arg title "Review Gate: $conclusion" --arg summary "$summary" \
            '{name: $name, head_sha: $sha, status: "completed", conclusion: $conclusion,
              output: {title: $title, summary: $summary}}' >"$body"
          # A write that fails must fail the job: a check that was never written
          # would otherwise read as "not required yet" rather than as a fault.
          gh api -X POST "repos/$GH_REPO/check-runs" --input "$body" >/dev/null
          echo "::notice::verdict $conclusion for $head is reported on the PR head"
          # --- review-gate:end ---
