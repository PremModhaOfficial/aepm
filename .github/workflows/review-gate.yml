name: Review Gate

# Model-free coverage gate. The review bot deliberately does not run on push;
# this check fails when a push made the existing review stale, or when no
# review exists for the head. It never calls a model and never spends credits.
#
# Findings stay advisory: this gate checks coverage, not the verdict. CI and
# Sim remain the merge gates for behaviour.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review Gate
    # Fork PRs are skipped by the review bot because `pull_request` does not
    # expose secrets to them, so the gate would fail forever with no way to
    # produce a review. This matches the bot's fork policy.
    #
    # On issue_comment, only the bot's persistent review comment carries the
    # typed marker; `/review` commands and human comments do not trigger a
    # redundant check. The comment is edited in place on re-review, hence the
    # `edited` event.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, 'pr-agent-review-state'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The gate runs the script from the base branch, not the PR head: a PR
      # must not be able to loosen the check it is judged by.
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Review must exist for this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: scripts/review-state.sh "$PR" --gate
