name: Review Gate

# Model-free coverage gate. The review bot deliberately does not run on push,
# so this check re-evaluates only when a review run finishes. After a push the
# new head has no `Review Gate` check at all, and once this check is required
# that absence is what blocks the merge. It fails when the review is missing,
# stale, or its verdict is not the clean pass. It never calls a model and never
# spends credits.
#
# One trigger only, and it loads both this file and the gate script from the
# default branch, so a PR can neither rewrite the check nor hand it a script.
# `workflow_run` is the review run rather than the review comment: the bot posts
# with `GITHUB_TOKEN`, and GitHub does not start workflows for events that token
# creates.
on:
  workflow_run:
    workflows: ["PR Agent"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  # Reading the triggering run's name and pull_requests.
  actions: read

concurrency:
  # Keyed on the run, not the head: a `/review` run reports the default branch
  # as its head, so a head key made runs for different PRs cancel each other.
  group: review-gate-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review Gate
    # Fork PRs are skipped by the review bot because `pull_request` does not
    # expose secrets to them, so the gate would fail forever with no way to
    # produce a review. This matches the bot's fork policy.
    # A skipped `/review` run changed nothing (the comment was not authorized),
    # and its gate run would land on the default branch, so this stays skipped.
    # A skipped review run on a push is a draft PR; that one is still evaluated,
    # because a skipped check counts as a pass.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !(github.event.workflow_run.event == 'issue_comment' &&
        github.event.workflow_run.conclusion == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Resolve which PR to gate, and take its head from the PR rather than from
      # the event: on a `/review` run both event fields describe the default
      # branch.
      - name: Resolve the PR and its head
        id: target
        env:
          # This runs before checkout, so there is no git remote for gh to infer
          # the repository from.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pr="${RUN_PR:-}"
          # A `/review` run carries no `pull_requests` entry and reports the
          # default branch as its head, so its PR comes from its run name. That
          # name is evaluated in an `issue_comment` run, which always loads the
          # default branch's copy of the workflow.
          if [[ -z "$pr" && "$RUN_EVENT" == "issue_comment" && "$RUN_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            pr="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .display_title 2>/dev/null \
              | grep -o 'PR #[0-9]\+' | tr -dc '0-9' || true)"
          fi
          [[ -n "$pr" ]] || { echo "::error::cannot tell which PR this run reviewed"; exit 1; }
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          # A run that named its own PR must agree with it: a green check may
          # never describe a different commit than the run that asked for it.
          if [[ "$RUN_EVENT" != "issue_comment" && -n "${RUN_SHA:-}" && "$head" != "$RUN_SHA" ]]; then
            echo "::error::PR $pr head $head is not this run's head $RUN_SHA"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
      # The script comes from the default branch, never from the PR head and
      # never from the PR's base ref: a PR aimed at another branch would
      # otherwise choose the script that judges it.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Review must exist for this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.target.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! scripts/review-state.sh --help | grep -q -- '--gate'; then
            # Before the gate exists on the default branch this workflow cannot
            # run at all, so this means the default branch lost `--gate`. A
            # neutral result would be counted as a pass, so this fails.
            echo "::error::$DEFAULT_BRANCH has no review-state.sh --gate; refusing to report a pass"
            exit 1
          fi
          exec scripts/review-state.sh "$PR" --gate
