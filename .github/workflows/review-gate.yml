name: Review Gate

# Model-free coverage gate. The review bot deliberately does not run on push,
# so this check re-evaluates after every push and after every review run, and
# fails when the review is missing, stale, or did not clear the merge. It never
# calls a model and never spends credits.
#
# The review run is the trigger, not the review comment: the bot posts with
# `GITHUB_TOKEN`, and GitHub does not start workflows for events that token
# creates, so an `issue_comment` trigger would never fire for it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["PR Agent"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Keyed on the head commit: two `/review` runs for different PRs both report
  # the base branch as their `head_branch`, and would cancel each other.
  group: review-gate-${{ github.event.workflow_run.head_sha || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review Gate
    # Fork PRs are skipped by the review bot because `pull_request` does not
    # expose secrets to them, so the gate would fail forever with no way to
    # produce a review. This matches the bot's fork policy.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Resolve which PR to gate. A review run started by `/review` has no
      # `pull_requests` entry and reports the base branch as its `head_branch`,
      # so the commit is the only reliable key.
      - name: Resolve the PR and the base ref
        id: target
        env:
          # This runs before checkout, so there is no git remote for gh to infer
          # the repository from.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="${PR:-}"
          if [[ -z "$pr" && -n "${SHA:-}" ]]; then
            pr="$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.state == "open")][0].number // empty')"
          fi
          [[ -n "$pr" ]] || { echo "::error::no open PR contains this commit; the gate cannot evaluate"; exit 1; }
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "base=$(gh pr view "$pr" --json baseRefName --jq .baseRefName)" >> "$GITHUB_OUTPUT"
      # The gate runs the script from the base branch, not the PR head: a PR
      # must not be able to loosen the check it is judged by.
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.base }}
          persist-credentials: false
      - name: Review must exist for this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.target.outputs.pr }}
          BASE: ${{ steps.target.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: |
          if scripts/review-state.sh --help | grep -q -- '--gate'; then
            exec scripts/review-state.sh "$PR" --gate
          fi
          # Bootstrap: on the PR that introduces `--gate`, the base branch still
          # has the old script, which exits 2 on the unknown flag and would make
          # this check red before merge. A base without `--gate` means there is
          # no gate to loosen yet, so running the head copy once is safe. Only
          # the default branch may bootstrap: pointing a PR at some other branch
          # must not hand the head copy the trust the base copy would have had.
          # `BASE` is a branch name or a commit, so ask git whether the default
          # branch contains it rather than comparing strings.
          if [[ "$BASE" != "$DEFAULT_BRANCH" ]]; then
            git fetch --quiet --unshallow origin 2>/dev/null || git fetch --quiet origin "$DEFAULT_BRANCH"
            if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
              echo "::error::base $BASE is not on $DEFAULT_BRANCH; refusing to run the PR copy"
              exit 1
            fi
          fi
          echo "::warning::base branch has no --gate yet: bootstrap, running the head copy"
          [[ -n "$HEAD_SHA" ]] || { echo "::error::bootstrap needs a head sha"; exit 1; }
          git fetch --depth=1 origin "$HEAD_SHA"
          git show "$HEAD_SHA:scripts/review-state.sh" > "$RUNNER_TEMP/gate.sh"
          exec bash "$RUNNER_TEMP/gate.sh" "$PR" --gate
