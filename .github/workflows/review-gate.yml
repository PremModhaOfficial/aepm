name: Review Gate

# Model-free coverage gate. The review bot deliberately does not run on push,
# so this check re-evaluates after every push and after every review run, and
# fails when the review is missing, stale, or did not clear the merge. It never
# calls a model and never spends credits.
#
# The review run is the trigger, not the review comment: the bot posts with
# `GITHUB_TOKEN`, and GitHub does not start workflows for events that token
# creates, so an `issue_comment` trigger would never fire for it.
#
# A `/review` run reports the default branch as its head and carries no
# `pull_requests` entry, so it cannot name its PR. `pr-agent.yml` prints the
# target it resolved, and the gate reads that line back from the run. GitHub
# anchors that gate run to the default branch too, so its verdict is accurate
# for the PR but the check itself cannot block the merge button: only the
# push-triggered runs land on the PR head.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["PR Agent"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  # Reading the target line out of another workflow's log.
  actions: read

concurrency:
  # Keyed on the run, not the head: every `/review` run reports the default
  # branch as its head, so a head key made runs for different PRs cancel each
  # other.
  group: review-gate-${{ github.event.workflow_run.id || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review Gate
    # Fork PRs are skipped by the review bot because `pull_request` does not
    # expose secrets to them, so the gate would fail forever with no way to
    # produce a review. This matches the bot's fork policy.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Resolve which PR to gate, and take its head and base from the PR rather
      # than from the event: on a `/review` run both event fields describe the
      # default branch.
      - name: Resolve the PR, its head, and the base ref
        id: target
        env:
          # This runs before checkout, so there is no git remote for gh to infer
          # the repository from.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pr="${PR:-}"
          [[ -n "$pr" ]] || pr="${RUN_PR:-}"
          # Last resort, for `/review` runs, which carry no `pull_requests` entry
          # and report the default branch as their head. That line comes from the
          # workflow file, and for a `pull_request` run the file is the PR's own,
          # so it is read only for `issue_comment` runs: those always load the
          # default branch's copy and cannot be rewritten by a PR.
          if [[ -z "$pr" && "$RUN_EVENT" == "issue_comment" && "$RUN_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            pr="$(gh run view "$RUN_ID" --log 2>/dev/null \
              | grep -m1 -o 'pr-agent-target: pr=[0-9]\+' | cut -d= -f2 || true)"
          fi
          [[ -n "$pr" ]] || { echo "::error::cannot tell which PR this run reviewed"; exit 1; }
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          gh pr view "$pr" --json headRefOid,baseRefName \
            --jq '"head=" + .headRefOid, "base=" + .baseRefName' >> "$GITHUB_OUTPUT"
      # The gate runs the script from the base branch, not the PR head: a PR
      # must not be able to loosen the check it is judged by.
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.base }}
          persist-credentials: false
      - name: Review must exist for this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.target.outputs.pr }}
          BASE: ${{ steps.target.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: |
          if scripts/review-state.sh --help | grep -q -- '--gate'; then
            exec scripts/review-state.sh "$PR" --gate
          fi
          # Bootstrap: on the PR that introduces `--gate`, the base branch still
          # has the old script, which exits 2 on the unknown flag and would make
          # this check red before merge. A base without `--gate` means there is
          # no gate to loosen yet, so running the head copy once is safe. Only
          # the default branch may bootstrap: a PR pointed at any other branch,
          # even one that branched off `main`, must not hand the head copy the
          # trust the base copy would have had. `BASE` is the PR's base branch
          # name as GitHub reports it, so this is a name comparison.
          if [[ "$BASE" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::base $BASE is not $DEFAULT_BRANCH; refusing to run the PR copy"
            exit 1
          fi
          echo "::warning::base branch has no --gate yet: bootstrap, running the head copy"
          [[ -n "$HEAD_SHA" ]] || { echo "::error::bootstrap needs a head sha"; exit 1; }
          git fetch --depth=1 origin "$HEAD_SHA"
          git show "$HEAD_SHA:scripts/review-state.sh" > "$RUNNER_TEMP/gate.sh"
          exec bash "$RUNNER_TEMP/gate.sh" "$PR" --gate
