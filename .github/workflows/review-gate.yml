name: Review Gate

# Model-free coverage gate. The review bot deliberately does not run on push,
# so this check re-evaluates after every push and after every review run, and
# fails when the review is missing, stale, or its verdict is not a clean pass.
# It never calls a model and never spends credits.
#
# Two triggers only, both of which load this file and the gate script from the
# default branch, so a PR can neither rewrite the check nor hand it a script.
# `workflow_run` is the review run rather than the review comment: the bot posts
# with `GITHUB_TOKEN`, and GitHub does not start workflows for events that token
# creates.
on:
  workflow_run:
    workflows: ["PR Agent"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  # Reading the triggering run's name and pull_requests.
  actions: read

concurrency:
  # Keyed on the run, not the head: a `/review` run reports the default branch
  # as its head, so a head key made runs for different PRs cancel each other.
  group: review-gate-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review Gate
    # Fork PRs are skipped by the review bot because `pull_request` does not
    # expose secrets to them, so the gate would fail forever with no way to
    # produce a review. This matches the bot's fork policy.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Resolve which PR to gate, and take its head and base from the PR rather
      # than from the event: on a `/review` run both event fields describe the
      # default branch.
      - name: Resolve the PR, its head, and the base ref
        id: target
        env:
          # This runs before checkout, so there is no git remote for gh to infer
          # the repository from.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pr="${RUN_PR:-}"
          # A `/review` run carries no `pull_requests` entry and reports the
          # default branch as its head, so its PR comes from its run name. That
          # name is evaluated in an `issue_comment` run, which always loads the
          # default branch's copy of the workflow.
          if [[ -z "$pr" && "$RUN_EVENT" == "issue_comment" && "$RUN_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            pr="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .display_title 2>/dev/null \
              | grep -o 'PR #[0-9]\+' | tr -dc '0-9' || true)"
          fi
          [[ -n "$pr" ]] || { echo "::error::cannot tell which PR this run reviewed"; exit 1; }
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          gh pr view "$pr" --json headRefOid,baseRefName \
            --jq '"head=" + .headRefOid, "base=" + .baseRefName' >> "$GITHUB_OUTPUT"
      # The gate runs the script from the base branch, not the PR head: a PR
      # must not be able to loosen the check it is judged by.
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.base }}
          persist-credentials: false
      - name: Review must exist for this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.target.outputs.pr }}
          BASE: ${{ steps.target.outputs.base }}
        run: |
          if ! scripts/review-state.sh --help | grep -q -- '--gate'; then
            # Before the gate lands on the base branch there is no trusted copy
            # to run, and the PR's copy is not one. Neutral states that: it is
            # not a pass, and the annotation says why. From the merge on, the
            # base always has the script and this branch is dead.
            echo "::notice::Review Gate is not on $BASE yet; the check is neutral until it lands"
            exit 78
          fi
          exec scripts/review-state.sh "$PR" --gate
