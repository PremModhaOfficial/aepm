name: Sim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch-sim:
    name: Arch simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scenario detector diffs the branch against its base commit.
          fetch-depth: 0
      - name: Check scenario numbering
        # Two scenario files with the same number make a log line and a README
        # row ambiguous. Fails before the image build spends a minute.
        run: ./sim/check-scenario-numbers.sh
      # A pull request runs exactly the scenarios its changed src/ paths map to
      # in sim/scenario-map.tsv, plus every scenario it edits, so a branch that
      # changes a scenario always runs it. A changed path under src/ with no row
      # fails here rather than merging with nothing exercised. main and
      # workflow_dispatch keep the full suite.
      - name: Select scenarios
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # The commit this pull request added, not the merge commit the runner
          # checked out: the merge commit also carries whatever `main` gained
          # since `base.sha` was frozen, and diffing that in runs scenarios the
          # change cannot reach (measured on #143: 27 of 56, 218s instead of 6s).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "work=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/gate-scenarios.sh --check-map
          # Inside sim-logs/ so the uploaded artifact records what this run chose,
          # including when it chose nothing.
          mkdir -p sim-logs
          list=sim-logs/selected-scenarios.txt
          scripts/gate-scenarios.sh --list "$BASE" "$HEAD_SHA" > "$list"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          # No scenarios is not a build with nothing to run: it is no build.
          if [[ -s $list ]]; then
            echo "work=yes" >> "$GITHUB_OUTPUT"
          else
            echo "work=no" >> "$GITHUB_OUTPUT"
          fi
          echo "$(grep -c . "$list" || true) scenario(s) selected by scripts/gate-scenarios.sh"
          sed 's/^/  /' "$list"
      # The image used to be built from scratch on every run: two `pacman -Syu`
      # layers and the crate compile, 118s of a 194s job, measured over 20 runs
      # with no layer reused. Its layers now live in the Actions cache, which is
      # the only cache the free tier offers and the same 10 GB rust-cache draws
      # from (4.0 GB used).
      - name: Set up buildx
        if: steps.select.outputs.work == 'yes'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the sim image
        if: steps.select.outputs.work == 'yes'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sim/Dockerfile
          tags: aepm-sim:ci
          # The scenarios run `$RUNTIME run` against this daemon, so the image
          # has to be loaded here, not left in the builder's cache.
          load: true
          cache-from: type=gha,scope=aepm-sim
          # A cache written by a `pull_request` run is scoped to
          # `refs/pull/N/merge` and can only be restored by a re-run of that same
          # pull request, so a pull request writes nothing and only `main` seeds
          # the cache every pull request reads.
          # ignore-error: a cache that cannot be written must never redden a
          # green gate. The build itself is the proof; the cache is an offer.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=aepm-sim,ignore-error=true' || '' }}
      - name: Run the scenarios
        env:
          # Flat directory so the artifact path is stable; run.sh prints it.
          SIM_LOG_DIR: sim-logs
          # Built above, with the cache. run.sh refuses to run when this names an
          # image that is not present.
          SIM_IMAGE: aepm-sim:ci
          SIM_NO_BUILD: "1"
        run: |
          set -euo pipefail
          if [[ "${{ steps.select.outputs.mode }}" != changed ]]; then
            ./sim/run.sh
            exit 0
          fi
          mapfile -t scenarios < "${{ steps.select.outputs.list }}"
          if ((${#scenarios[@]} == 0)); then
            echo "no src/ or sim/ change in this pull request; nothing to run"
            exit 0
          fi
          ./sim/run.sh "${scenarios[@]}"
      - name: Upload scenario logs
        # Always: a failed or timed-out run is the one whose log is needed.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: sim-logs/
          if-no-files-found: warn
          retention-days: 14
