name: OCR Shadow

# A shadow reviewer: Alibaba open-code-review, run by hand for ONE pull request
# at a time, beside pr-agent. It is measurement, not gating. The only way it
# starts is an operator dispatch, so it never sits on a pull request of its own
# accord, and it posts no comment: the artefacts are the output.
#
# Why a second reviewer exists: pr-agent emits no typed block on a zero-finding
# review, so a clean pull request can never satisfy Review Gate (#141/#142), and
# its recall is unmeasured. open-code-review always emits a `comments` array,
# empty or not.
#
# The previous attempt hid its own failure: a 3-second, 576-token,
# zero-tool-call run reported "0 findings" over a review that never happened.
# So every dispatch prints the exit code, the artefact's `status`, its comment
# count, its `files_reviewed`, its `total_tokens` and the last 20 lines of
# stderr, and fails red when there was no review. `total_tokens` lives at
# `.summary.total_tokens`; the top-level field this report used to read does not
# exist in a v1.13.13 artefact, so it printed `missing` on every run.
#
# The guard fails on five shapes, all measured against the pinned binary rather
# than argued: a nonzero exit; a `status` that is not `complete`; a `status` of
# `skipped` (what an empty range produces — exit 0, "no items were selected",
# zero files, zero comments, so a guard reading only `status != complete` would
# already fail it, but the message is what tells an operator why); and zero
# `files_reviewed`, which is comments on nothing. A count that is not a number,
# what `missing` and `unparsed` are, is the same refusal one step earlier. Zero
# comments is not one of the shapes: a completed review of files that raises no
# finding is a clean review and passes. Red here gates nothing; it only refuses
# to look green.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string

# One dispatch per pull request; a second replaces nothing and runs after.
concurrency:
  group: ocr-shadow-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  OCR_VERSION: v1.13.13
  # Integrity pin: the binary is fetched over the network on every run.
  OCR_SHA256: e3eb634c8205a120c16e9943de00aef895e2cd86d6b13c38e25427c924275ec8
  # The same subscription and model the existing CI reviewer uses; the endpoint
  # is OpenAI-compatible (see .pr_agent.toml and pr-agent.yml).
  OCR_LLM_URL: https://api.commandcode.ai/provider/v1
  OCR_LLM_MODEL: deepseek/deepseek-v4.1-flash
  OCR_ENABLE_TELEMETRY: "0"

jobs:
  review:
    name: OCR shadow review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the pull request head and base
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The dispatch value reaches the shell as environment, never
          # interpolated into the script body: a value containing $(...) or a
          # backtick would otherwise be evaluated on a runner holding the key.
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          num="$DISPATCH_PR"
          # A fork head runs untrusted code on this runner; the model key must
          # not be in the environment when it does.
          if [[ "$(gh pr view "$num" --json isCrossRepository --jq .isCrossRepository)" != "false" ]]; then
            echo "::error::PR #$num does not report isCrossRepository=false; refusing to run with the model key"
            exit 1
          fi
          gh pr view "$num" --json number,baseRefName,headRefOid \
            --jq '"pr=\(.number) base=\(.baseRefName) head=\(.headRefOid)"'
          gh pr checkout "$num"
          base="$(gh pr view "$num" --json baseRefName --jq .baseRefName)"
          git fetch --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}"
          printf 'num=%s\nbase=origin/%s\n' "$num" "$base" >> "$GITHUB_OUTPUT"

      - name: Show what will be reviewed
        # Free, and the first thing to read when a run finishes in seconds with
        # no tool calls: an empty range is why the model had nothing to look at.
        env:
          BASE: ${{ steps.r.outputs.base }}
        run: |
          set -euo pipefail
          # The merge base, not the base tip. Measured against v1.13.13: ocr's own
          # `resolved_base` for `--from main` on a branch that was behind main was
          # already the merge base, so the two endpoints do not by themselves pull
          # in base commits. This step still resolves the merge base explicitly,
          # because it is the thing that can be checked before the model is paid,
          # and because the range a review covers should be the range an operator
          # was shown.
          # `git merge-base BASE HEAD` exits 0 and prints HEAD when HEAD is already
          # the base, and 128 with empty stdout when the base ref is missing. Left
          # alone, the first case reviews an empty range and every check after it
          # passes, which is the silent green this workflow exists to refuse. So
          # the sha is validated as a sha and the range is required to be non-empty.
          mb=$(git merge-base "$BASE" HEAD) || {
            echo "::error::no merge base for $BASE and HEAD; nothing can be reviewed"
            exit 1
          }
          printf '%s' "$mb" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error::merge-base printed no commit sha: [$mb]"
            exit 1
          }
          if [ "$mb" = "$(git rev-parse HEAD)" ]; then
            echo "::error::HEAD is the base ($mb): the range is empty and a review of it would prove nothing"
            exit 1
          fi
          if [ -z "$(git diff --name-only "$mb" HEAD)" ]; then
            echo "::error::the range $mb..HEAD changes no files; refusing to review nothing"
            exit 1
          fi
          printf '%s\n' "$mb" > merge-base.txt
          echo "merge-base: $mb"
          git diff --stat "$mb" HEAD

      - name: Install open-code-review
        run: |
          set -euo pipefail
          # $RUNNER_TEMP, not /usr/local/bin: the job runs as the unprivileged
          # `runner` user and /usr/local/bin is root-owned, so writing there
          # fails before the checksum is ever compared. The binary is verified
          # where it was written and only then copied into place.
          url="https://github.com/alibaba/open-code-review/releases/download/${OCR_VERSION}/opencodereview-linux-amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ocr" "$url"
          echo "${OCR_SHA256}  $RUNNER_TEMP/ocr" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ocr"
          sudo install -m 0755 "$RUNNER_TEMP/ocr" /usr/local/bin/ocr
          ocr --version

      - name: Configure the LLM endpoint
        # The protocol must be named. With only OCR_LLM_* env vars set, the CLI
        # speaks the Anthropic protocol and POSTs <base>/v1/messages, which this
        # endpoint answers with 404. Protocol "openai" POSTs /chat/completions,
        # which it answers 401 for a bad key — i.e. the correct route.
        env:
          OCR_LLM_TOKEN: ${{ secrets.COMMAND_CODE_API_KEY }}
        run: |
          set -euo pipefail
          timeout 60 ocr config set provider cc-gateway
          timeout 60 ocr config set custom_providers.cc-gateway.url "${OCR_LLM_URL}"
          timeout 60 ocr config set custom_providers.cc-gateway.protocol openai
          timeout 60 ocr config set custom_providers.cc-gateway.api_key "${OCR_LLM_TOKEN}" >/dev/null
          timeout 60 ocr config set model "${OCR_LLM_MODEL}"

      - name: Check LLM connectivity
        # Spend a tiny call to prove the endpoint before spending a review: a
        # bad credential otherwise surfaces as a completed review that found
        # nothing.
        run: |
          set +e
          out=$(timeout 90 ocr llm test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out" | tail -n 20
          if [ "$rc" != 0 ]; then
            echo "::error::ocr llm test failed (exit $rc): the review would have run blind"
            exit 1
          fi

      - name: Review
        id: ocr
        env:
          BASE: ${{ steps.r.outputs.base }}
        run: |
          set +e
          # A missing merge-base.txt must not fall through to `ocr review` with no
          # --from: with no range, ocr reviews the whole workspace and a green
          # result would describe files this pull request never touched.
          if [ ! -s merge-base.txt ]; then
            echo "::error::merge-base.txt is missing or empty; refusing to run a range-less review"
            exit 1
          fi
          # No token ceiling (--max-tokens-budget 0): a ceiling is exactly what
          # truncated the previous attempt. --timeout is OCR's own task budget in
          # minutes, kept under the job's timeout-minutes so the guard reports
          # rather than the job being killed.
          # --effort low, not high: high is the only setting measured to fail on
          # this endpoint (4 of 11 runs died `budget_exceeded` at 349 input tokens
          # of 120,000). The shadow exists to measure, so it uses the setting that
          # completes; see docs/research/reviewer-decision.md.
          timeout 780 ocr review --from "$(cat merge-base.txt)" --to HEAD \
            --format json --output ocr.json --audience agent \
            --effort low --concurrency 4 --max-tokens-budget 0 \
            --timeout 12 2>ocr-stderr.log
          rc=$?
          set -e

          status=missing; comments=missing; tokens=missing; files=missing
          if [ -s ocr.json ]; then
            status=$(jq -r '.status // "missing"' ocr.json 2>/dev/null) || status=unparsed
            comments=$(jq -r '(.comments // []) | length' ocr.json 2>/dev/null) || comments=unparsed
            # The count lives at .summary.total_tokens, not at the top level.
            # Measured: `.total_tokens // .usage.total_tokens` printed `missing`
            # on a real artefact (v1.13.13), so the field this report exists to
            # show was never shown. .summary is kept as the second fallback.
            tokens=$(jq -r '.total_tokens // .summary.total_tokens // .usage.total_tokens // "missing"' ocr.json 2>/dev/null) || tokens=unparsed
            files=$(jq -r '.summary.files_reviewed // "missing"' ocr.json 2>/dev/null) || files=unparsed
            echo "top-level keys: $(jq -r 'keys | join(",")' ocr.json 2>/dev/null || echo unparsed)"
          else
            echo "no ocr.json was written"
          fi

          echo "OCR exit code: $rc"
          echo "status: $status"
          echo "comments: $comments"
          echo "files_reviewed: $files"
          echo "total_tokens: $tokens"
          echo "--- last 20 lines of OCR stderr ---"
          tail -n 20 ocr-stderr.log 2>/dev/null || echo "(no stderr captured)"

          {
            echo "### OCR Shadow (advisory)"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| OCR exit code | \`$rc\` |"
            echo "| status | \`$status\` |"
            echo "| comments | \`$comments\` |"
            echo "| files_reviewed | \`$files\` |"
            echo "| total_tokens | \`$tokens\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Red when no review happened, judged by the file count rather than by
          # `status` or by the comment count. Measured on #149: a run finished in
          # 3s with 576 tokens and zero tool calls and still reported `status:
          # failed` with an empty range, so a guard reading only `status` would
          # have passed a run that reviewed nothing; measured on a real v1.13.13
          # artefact, an empty range exits 0 with `status: skipped` and zero
          # files. Zero `comments` is the other case and it is not a failure: a
          # completed review of files that raises no finding is a clean review,
          # so the count is printed and not judged. `comments` and `files` are
          # `missing` when ocr.json was never written and `unparsed` when jq
          # could not read it; both are refused here rather than compared as
          # numbers, because [ "missing" = 0 ] is false and would pass.
          case "$comments" in
            ''|*[!0-9]*) echo "::error::comment count is not a number ($comments): no artefact to judge"; exit 1 ;;
          esac
          case "$files" in
            ''|*[!0-9]*) echo "::error::files_reviewed is not a number ($files): no artefact to judge"; exit 1 ;;
          esac
          if [ "$status" = "skipped" ]; then
            echo "::error::ocr skipped the review ($(jq -r '.message // "no message"' ocr.json 2>/dev/null)): nothing was reviewed"
            exit 1
          fi
          if [ "$rc" != 0 ] || [ "$status" != "complete" ] || [ "$files" = 0 ]; then
            echo "::error::no review happened (exit $rc, status $status, comments $comments, files_reviewed $files)"
            exit 1
          fi

      - name: Upload the review artefacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-shadow-pr-${{ inputs.pr }}
          path: |
            ocr.json
            ocr-stderr.log
          if-no-files-found: warn
