name: PR Agent
# The Review Gate finds its PR from this run, and a `/review` run reports the
# default branch instead of the PR, so the run names its target.
run-name: "Review PR #${{ github.event.pull_request.number || github.event.issue.number }}"

# Agentic PR review on top of CI and Sim. Self-hosted pr-agent calls the
# official Command Code Provider API directly: OpenAI-compatible, API-key only,
# no bridge, no tunnel, no developer machine.
#
# One-time setup: create a dedicated key at
# https://commandcode.ai/docs/studio#api-keys and store it as the
# COMMAND_CODE_API_KEY repository secret.
#
# Policy and the decision record: .pr_agent.toml and .github/PR-AGENT.md.
# Fork PRs are skipped because `pull_request` does not expose secrets to them
# (GitHub Docs, "Using secrets in GitHub Actions"). Never switch this to
# pull_request_target with an untrusted checkout.
on:
  pull_request:
    # `synchronize` is #115: a head that received a commit after the PR opened
    # got no review at all, and nothing said so. A push now reviews the head it
    # created. The bounds are in the job guard below (drafts and forks are
    # skipped) and in the first steps (a head that already carries a complete
    # review of that exact commit is not reviewed again, so the trigger does not
    # spend a model call per push).
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review
    # Commands are authorized here, not by the trigger: on a public repo anyone
    # could comment "/review" and spend credits. Skipped commands do not join
    # the concurrency group, so they cannot cancel a queued review.
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request != null &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         startsWith(github.event.comment.body, '/'))) &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.draft == false &&
         github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      # A new push means the reviewed head is gone, so cancel its review rather
      # than queue behind it. `false` queued: the push to 88f61cf at 18:14:33Z
      # became run 44790899058 `pending`, waiting on 44787885830 which was still
      # `in_progress` from 17:55:27Z. Cancelling costs the wasted tokens of one
      # superseded review; queueing costs a full round of wall clock.
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      # Only a push supersedes a review: it replaces the head the review was
      # reading. The trigger is the action, not the event, because
      # `pull_request` also fires on `reopened` and `ready_for_review`, and
      # neither moves the head: cancelling there lost a review of the current
      # head and left the gate failing closed until someone ran `/review` again
      # (findings 8a0615637616, 5411d6da8710). `synchronize` is the one action
      # that replaces the head. Comment and other runs still queue behind a
      # review, and behind each other in one group, so two runs never write the
      # same review comment at once.
      cancel-in-progress: ${{ github.event.action == 'synchronize' }}
    runs-on: ubuntu-latest
    # p100 over 100 runs was 695s, but three reviews sharing one gateway on
    # 2026-11-20 ran past 20 minutes (44787885830 was 21 minutes in and still
    # going), so 20 would cancel work that finishes. 30 still fails a silent run
    # in half the old ceiling's time.
    timeout-minutes: 40
    steps:
      # A PR must not hand the reviewer's side its own copy of the check, so it
      # comes from the default branch, as in review-gate.yml.
      - name: Check out the default branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # The bound on `synchronize`: a head that already carries a complete review
      # of that exact commit is not reviewed again, so a rebase that changes no
      # diff spends nothing. `--reviewed` is the state command's own question, so
      # the skip shares one definition of "reviewed" with the gate rather than
      # owning a second one. It ignores the verdict on purpose: a review that
      # asked for changes still covered that commit, and the commit after the fix
      # is a different one. An error here reads as "not reviewed", so a broken
      # check costs a model call rather than a silent missing review.
      - name: Is this head already reviewed?
        id: reviewed
        if: github.event_name == 'pull_request'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if scripts/review-state.sh "$PR" --reviewed --sha "$SHA" >/dev/null 2>&1; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR already carries a complete review of $SHA; not reviewing it again"
          else
            echo "reviewed=false" >> "$GITHUB_OUTPUT"
          fi
      # Spelled out for `issue_comment`: that event has no `reviewed` step, so its
      # output is empty, and an empty output must not be the only reason `/review`
      # still runs. A future default of `true` would otherwise disable every
      # `/review` command silently.
      - name: pr-agent
        if: github.event_name == 'issue_comment' || steps.reviewed.outputs.reviewed != 'true'
        # pragent/pr-agent:0.50.0-github_action, pinned by manifest digest.
        # 0.50.0 adds the run-details section (model, tokens in/out, duration,
        # AI calls), which is the only place token usage is observable: the job
        # log prints prompt tokens only.
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Official Provider API: https://commandcode.ai/docs/provider
          OPENAI_API_KEY: ${{ secrets.COMMAND_CODE_API_KEY }}
          OPENAI__API_BASE: https://api.commandcode.ai/provider/v1
          # Model, token budgets and timeouts live in `.pr_agent.toml` alone,
          # read from the checkout above, which is the default branch: a PR
          # cannot change the config it is reviewed with, and a missing value
          # fails the run loudly instead of silently changing the model.
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          # A pushed head is reviewed. These stay in the workflow as well as in
          # `.pr_agent.toml`, unlike the model config: a miss here skips the
          # review while the run still goes green, so it is the one setting that
          # must not depend on config loading order.
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
      # #140: a clean review is posted without the typed state block, so
      # `review-state.sh` read `present: false` and the Review Gate said "no review
      # comment from the bot" about a review that did run. The image is pinned and
      # cannot be patched, so the block is appended to the body it posted. Only the
      # block is added: the review text stays verbatim above it, a body that already
      # carries a block is never rewritten, and a body with no merge recommendation
      # gets nothing rather than an invented verdict. `gh api -X PATCH` replaces the
      # body, hence `--input` and a file. The block is run by
      # `scripts/check-pr-agent-state-block.sh`, which extracts it from here.
      - name: Append the typed review state block
        # The job guard already skips a draft and a fork PR; the step repeats it
        # because the bind is here, not only there: on a draft the `reviewed` step
        # is skipped, so its output is empty, the condition below was true, and the
        # step could append a block naming an older head for a review the model
        # never ran (#153). `issue_comment` carries no `pull_request`, so `/review`
        # passes the second half untouched.
        if: >-
          (github.event_name == 'issue_comment' ||
            steps.reviewed.outputs.reviewed != 'true') &&
          (github.event_name != 'pull_request' ||
            (github.event.pull_request.draft == false &&
             github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BOT_LOGIN: github-actions[bot]
        run: |
          # --- pr-agent-state:begin ---
          set -euo pipefail
          # The newest bot comment that is a review, blocked or not. Selection stops
          # there (#153): an earlier version asked for "newest that has no block", so
          # when the newest review already carried one a re-run walked back and
          # rewrote an older review with a block naming an older head. The merge
          # recommendation is deliberately not part of this selection either: a
          # review that printed none must write nothing, not fall back to an older
          # comment whose recommendation describes another commit.
          # `--paginate`, because a PR with more than one page of comments hid its
          # newest review past page 1 and the block then landed on an older comment
          # or nowhere at all (#153). `--jq '.[]'` streams one comment per line from
          # every page; `jq -s` puts them back into one array, so "newest" still
          # means the newest comment on the PR rather than the last of a page.
          comments_url="repos/$GH_REPO/issues/$PR/comments"
          comment="$(gh api --paginate "$comments_url?per_page=100" --jq '.[]' \
            | jq -cs '[.[]
              | select(.user.login == env.BOT_LOGIN)
              | select(.body | contains("pr-agent:review"))]
              | last // {}')"
          comment_id="$(jq -r '.id // empty' <<<"$comment")"
          if [[ -z "$comment_id" ]]; then
            echo "::notice::PR #$PR has no pr-agent review comment; nothing to append"
            exit 0
          fi
          body="$(jq -r '.body // ""' <<<"$comment")"
          if [[ "$body" == *"pr-agent-review-state:v1"* ]]; then
            echo "::notice::PR #$PR comment $comment_id already carries a state block; nothing to append"
            exit 0
          fi

          # The gate's own token: lowercase, spaces to underscores, the same
          # pipeline `review-state.sh` runs. Only its presence is needed here.
          verdict="$(sed -n 's/.*<strong>Merge recommendation<\/strong>:[[:space:]]*\([^<]*\).*/\1/p' <<<"$body" | head -1 | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | xargs)"
          if [[ -z "$verdict" ]]; then
            echo "::notice::PR #$PR comment $comment_id printed no merge recommendation; no state block written"
            exit 0
          fi

          # The commit the review read, from the body's own footer; the event
          # payload is the only other source, and it is the head this run was
          # created for. There is no API fallback (#153): `repos/$GH_REPO/pulls/$PR`
          # answers the head at append time, so a push landing between the review
          # and the append would be recorded as reviewed and `--gate` would pass on
          # a review of an older commit. An unverifiable head writes nothing.
          reviewed="$(sed -n 's/.*Review updated until commit[[:space:]]*\([^ )]*\).*/\1/p' <<<"$body" | head -1)"
          reviewed="${reviewed##*/}"
          if [[ ! "$reviewed" =~ ^[0-9a-f]{40}$ ]]; then
            reviewed="${PR_HEAD:-}"
          fi
          if [[ ! "$reviewed" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::notice::the review of PR #$PR names no commit and this event carries no head; no state block written"
            exit 0
          fi

          # The shape the gate parses: the marker line, one JSON line, and `-->`
          # alone on its last line.
          json="$(jq -cn --arg sha "$reviewed" \
            '{findings: [], last_run: {complete: true, excluded_files: [], head_sha: $sha}, schema_version: 1}')"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          {
            printf '%s\n\n' "$body"
            printf '<!-- pr-agent-review-state:v1\n%s\n-->\n' "$json"
          } >"$tmp/body"
          jq -n --rawfile body "$tmp/body" '{body: $body}' >"$tmp/payload.json"
          gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" --input "$tmp/payload.json" >/dev/null
          echo "::notice::PR #$PR comment $comment_id now records a complete review of $reviewed ($verdict)"
          # --- pr-agent-state:end ---
